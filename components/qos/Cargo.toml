[package]
name = "ohos-qos-sys"
version = "0.1.0"
edition = "2021"
description = "Raw bindings to the QoS (thread priority scheduling) API and Gewu on-device LLM inference APIs of OpenHarmony"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi", "qos", "Inference"]
readme = "README.md"

[dependencies]
document-features = { version = "0.2", optional = true }

[features]
default = []

api-10 = []
api-11 = ["api-10"]
## Enables bindings for OpenHarmony API-level 12. This is the lowest API level
## at which any QoS APIs are available — selecting this feature is required to
## use `OH_QoS_SetThreadQoS` / `OH_QoS_ResetThreadQoS` / `OH_QoS_GetThreadQoS`.
api-12 = ["api-11"]
api-13 = ["api-12"]
api-14 = ["api-13"]
api-15 = ["api-14"]
api-16 = ["api-15"]
api-17 = ["api-16"]
api-18 = ["api-17"]
api-19 = ["api-18"]
## Enables bindings for OpenHarmony API-level 20, which adds the Gewu on-device
## LLM inference APIs (`OH_QoS_GewuCreateSession`, `OH_QoS_GewuSubmitRequest`,
## etc.) alongside the existing thread QoS surface.
api-20 = ["api-19"]
## Enables bindings for OpenHarmony API-level 21.
api-21 = ["api-20"]
## Enables bindings for OpenHarmony API-level 22.
api-22 = ["api-21"]
## Enables bindings for OpenHarmony API-level 23.
api-23 = ["api-22"]
## Document available features when building the documentation
document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["document-features"]
targets = ["aarch64-unknown-linux-ohos", "armv7-unknown-linux-ohos", "x86_64-unknown-linux-ohos"]
all-features = true
