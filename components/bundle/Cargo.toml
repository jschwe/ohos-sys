[package]
name = "ohos-libbundle-sys"
version = "0.1.0"
edition = "2021"
description = "Raw bindings to the BundleManager (native bundle) NDK of OpenHarmony"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi", "bundle", "bundlemanager"]
readme = "README.md"

[dependencies]
document-features = { version = "0.2", optional = true }
ohos-sys-opaque-types = { workspace = true }

[features]
default = []

## Enables bindings for OpenHarmony API-level 10
api-10 = []
## Enables bindings for OpenHarmony API-level 11, which adds
## `OH_NativeBundle_GetAppId` and `OH_NativeBundle_GetAppIdentifier`.
api-11 = ["api-10"]
api-12 = ["api-11"]
## Enables bindings for OpenHarmony API-level 13, which adds
## `OH_NativeBundle_ElementName` and `OH_NativeBundle_GetMainElementName`.
api-13 = ["api-12"]
## Enables bindings for OpenHarmony API-level 14, which adds
## `OH_NativeBundle_GetCompatibleDeviceType`.
api-14 = ["api-13"]
api-15 = ["api-14"]
api-16 = ["api-15"]
api-17 = ["api-16"]
api-18 = ["api-17"]
api-19 = ["api-18"]
## Enables bindings for OpenHarmony API-level 20, which adds
## `OH_NativeBundle_IsDebugMode` and `OH_NativeBundle_GetModuleMetadata` plus
## the `OH_NativeBundle_Metadata` / `OH_NativeBundle_ModuleMetadata` structs.
api-20 = ["api-19"]
## Enables bindings for OpenHarmony API-level 21, which adds the
## `BundleManager_ErrorCode` enum, the opaque
## `OH_NativeBundle_AbilityResourceInfo` type, and the file-type intent
## discovery flow (`OH_NativeBundle_GetAbilityResourceInfo` and friends).
api-21 = ["api-20"]
api-22 = ["api-21"]
api-23 = ["api-22"]
## Document available features when building the documentation
document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["document-features"]
targets = ["aarch64-unknown-linux-ohos", "armv7-unknown-linux-ohos", "x86_64-unknown-linux-ohos"]
all-features = true
